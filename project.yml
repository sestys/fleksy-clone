name: FleksyClone
options:
  bundleIdPrefix: com.matejsestak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FleksyCore:
    path: Packages/FleksyCore
targets:
  FleksyClone:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: FleksyKeyboard
        embed: true
      - package: FleksyCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fleksy Clone
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejsestak.fleksyclone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  FleksyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Resources/Dictionaries
        type: folder
        buildPhase: resources
    dependencies:
      - package: FleksyCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Fleksy Clone
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: cs
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejsestak.fleksyclone.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
  FleksyCloneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FleksyClone
      - package: FleksyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejsestak.fleksyclone.uitests
        TEST_TARGET_NAME: FleksyClone
schemes:
  FleksyClone:
    build:
      targets:
        FleksyClone: all
        FleksyKeyboard: all
        FleksyCloneUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FleksyCloneUITests
